name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-lint:
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy-ros-base-noble

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ros2_ws/src/rbot

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y \
            curl \
            gnupg \
            lsb-release \
            python3-rosdep \
            python3-colcon-common-extensions \
            python3-pip \
            python3-flake8 \
            python3-pytest
          curl -sSL https://packages.osrfoundation.org/gazebo.gpg \
            -o /usr/share/keyrings/pkgs-osrf-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/pkgs-osrf-archive-keyring.gpg] \
            http://packages.osrfoundation.org/gazebo/ubuntu-stable $(lsb_release -cs) main" \
            > /etc/apt/sources.list.d/gazebo-stable.list
          apt-get update
          apt-get install -y \
            gz-harmonic \
            ros-jazzy-ros-gz \
            ros-jazzy-gz-ros2-control

      - name: Test simulation assets
        run: |
          cd ros2_ws/src/rbot
          python3 -m pytest tests -q

      - name: rosdep install
        run: |
          cd ros2_ws
          . /opt/ros/jazzy/setup.sh
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y

      - name: Build
        run: |
          cd ros2_ws
          . /opt/ros/jazzy/setup.sh
          colcon build \
            --symlink-install \
            --cmake-args -DCMAKE_BUILD_TYPE=Release \
            --event-handlers console_cohesion+

      - name: Lint Python (flake8)
        run: |
          # Limit linting to repository packages to avoid generated ROS workspace files.
          cd ros2_ws
          python3 -m flake8 src/rbot/src \
            --max-line-length=100 \
            --extend-ignore=E203,D100,D101,D103,D104,D107,D301,D400,I100,I101,I201,Q000,CNL100 \
            --exclude=__pycache__

      - name: Test
        run: |
          cd ros2_ws
          . install/setup.sh
          colcon test \
            --event-handlers console_cohesion+ \
            --return-code-on-test-failure

      - name: Test results
        if: always()
        run: |
          cd ros2_ws
          colcon test-result --verbose
